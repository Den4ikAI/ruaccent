[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ruaccent"
description = "A Russian text accentuation tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Denis Petrov", email = "arduino4b@gmail.com" }]
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "huggingface_hub>=0.23",
    "numpy",
    "onnxruntime",
    "razdel",
    "transformers>=4.30",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Den4ikAI/ruaccent"
Models = "https://huggingface.co/ruaccent/accentuator"

[tool.setuptools]
packages = ["ruaccent"]

[tool.setuptools.dynamic]
version = { attr = "ruaccent.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: tests that need the downloaded models (set RUACCENT_TEST_MODELS=1)"]
